services:
  - type: web
    name: ats-resume-optimizer
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: |
      # Set up Chrome cache directory
      export PUPPETEER_CACHE_DIR=/opt/render/project/src/.cache/puppeteer
      mkdir -p $PUPPETEER_CACHE_DIR
      # Install Node dependencies
      npm install
      # Let Puppeteer download Chrome
      npx puppeteer browsers install chrome --path $PUPPETEER_CACHE_DIR
      # Verify Chrome installation
      ls -la $PUPPETEER_CACHE_DIR
      # Build Next.js app
      npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: GROQ_API_KEY
        sync: false
      - key: LLAMA_CLOUD_API_KEY
        sync: false
