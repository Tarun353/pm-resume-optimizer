services:
  - type: web
    name: ats-resume-optimizer
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: |
      # Install dependencies required for Chromium
      apt-get update
      apt-get install -y \
        chromium \
        chromium-sandbox \
        fonts-liberation \
        libasound2 \
        libatk-bridge2.0-0 \
        libatk1.0-0 \
        libatspi2.0-0 \
        libcups2 \
        libdbus-1-3 \
        libdrm2 \
        libgbm1 \
        libgtk-3-0 \
        libnspr4 \
        libnss3 \
        libwayland-client0 \
        libxcomposite1 \
        libxdamage1 \
        libxfixes3 \
        libxkbcommon0 \
        libxrandr2 \
        xdg-utils
      # Verify Chromium is installed
      which chromium || which chromium-browser
      chromium --version || chromium-browser --version
      # Install Node packages
      npm install
      # Build Next.js
      npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: GROQ_API_KEY
        sync: false
      - key: LLAMA_CLOUD_API_KEY
        sync: false
